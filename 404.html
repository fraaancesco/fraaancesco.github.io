<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 — Signal lost · Francesco Pistorio</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#07080a">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=IBM+Plex+Mono:wght@400&family=IBM+Plex+Sans:wght@400;500&display=swap">
  <style>
    :root { --bg: #07080a; --text: #ecebe6; --muted: #8f939c; --line: rgba(236,235,230,.12); --accent: #f3e600; color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; min-height: 100svh; display: grid; place-items: center;
      padding: 32px 16px; background: var(--bg); color: var(--text);
      font-family: "IBM Plex Sans", system-ui, sans-serif; line-height: 1.6;
      background-image:
        radial-gradient(700px circle at 50% 40%, rgba(243,230,0,.05), transparent 60%),
        repeating-linear-gradient(0deg, transparent 0 39px, rgba(236,235,230,.03) 39px 40px),
        repeating-linear-gradient(90deg, transparent 0 39px, rgba(236,235,230,.03) 39px 40px);
    }
    main { width: 100%; max-width: 760px; display: grid; gap: 28px; justify-items: start; }
    .mono { font-family: "IBM Plex Mono", monospace; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
    .mono b { color: var(--accent); font-weight: 400; }
    h1 {
      margin: 0; font-family: "Chakra Petch", sans-serif; font-weight: 700; text-transform: uppercase;
      font-size: clamp(96px, 26vw, 220px); line-height: .82;
      color: transparent; -webkit-text-stroke: 1.5px var(--text); position: relative;
    }
    h1::after {
      content: "404"; position: absolute; left: 0; top: 0; color: var(--accent); -webkit-text-stroke: 0;
      clip-path: inset(0 0 100% 0); animation: scan 3.2s cubic-bezier(.7,0,.2,1) infinite;
    }
    @keyframes scan { 0% { clip-path: inset(0 0 100% 0); } 50% { clip-path: inset(0 0 0 0); } 100% { clip-path: inset(100% 0 0 0); } }
    h2 { margin: 0; font-family: "Chakra Petch", sans-serif; font-weight: 600; text-transform: uppercase; font-size: clamp(28px, 5vw, 44px); line-height: 1; }
    p { margin: 0; color: var(--muted); max-width: 46ch; font-size: 18px; }
    a {
      display: inline-flex; align-items: center; gap: 10px; min-height: 52px; padding: 14px 26px; border-radius: 999px;
      background: var(--accent); color: #0a0a06; font-weight: 500; text-decoration: none; transition: box-shadow .3s;
    }
    a:hover { box-shadow: 0 10px 40px -10px rgba(243,230,0,.55); }
    a:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }
    @media (prefers-reduced-motion: reduce) { h1::after { animation: none; clip-path: none; opacity: .0; } }
  </style>
</head>
<body>
  <main>
    <p class="mono"><b>ERR_</b> route not found</p>
    <h1>404</h1>
    <h2>Signal lost.</h2>
    <p>The page you were looking for doesn't exist — or it's hiding better than most security headers.</p>
    <a href="/">← Back to the portfolio</a>
  </main>
</body>
</html>
